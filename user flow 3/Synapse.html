<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Synapse – Clinical Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: #e8edf2;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 40px 20px;
  }

  /* Tweaks panel */
  #tweaks-panel {
    display: none;
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    z-index: 9999;
    width: 240px;
    font-family: 'Inter', sans-serif;
  }
  #tweaks-panel h3 { font-size: 13px; font-weight: 600; color: #1a1a2e; margin-bottom: 14px; }
  #tweaks-panel label { display: block; font-size: 11px; color: #666; margin-bottom: 4px; margin-top: 10px; }
  #tweaks-panel select, #tweaks-panel input[type=range] { width: 100%; font-size: 12px; }
</style>
</head>
<body>

<div id="root"></div>

<div id="tweaks-panel">
  <h3>Tweaks</h3>
  <label>Greeting Time</label>
  <select id="tw-greeting">
    <option value="evening">Good evening</option>
    <option value="morning">Good morning</option>
    <option value="afternoon">Good afternoon</option>
  </select>
  <label>System Status</label>
  <select id="tw-status">
    <option value="stable">All Good</option>
    <option value="attention">Needs Attention</option>
  </select>
  <label>Card Accent</label>
  <select id="tw-accent">
    <option value="violet">Soft Violet</option>
    <option value="blue">Clinical Blue</option>
    <option value="teal">Teal</option>
  </select>
</div>

<script type="text/babel">
const { useState, useEffect, useRef } = React;

const COLORS = {
  blue: '#3B6FE8',
  blueLight: '#EEF2FF',
  blueMid: '#5B8DF6',
  violet: '#6C63FF',
  violetLight: '#F0EEFF',
  green: '#2BAE76',
  greenLight: '#E8F8F0',
  amber: '#F5A623',
  amberLight: '#FFF7E8',
  text: '#1A1D2E',
  textMid: '#4A5068',
  textSoft: '#8B92A9',
  card: '#FFFFFF',
  bg: '#F4F6FA',
  border: '#ECEEF4',
};

const accentMap = {
  violet: { main: '#6C63FF', light: '#F0EEFF', icon: '#8B84FF' },
  blue:   { main: '#3B6FE8', light: '#EEF2FF', icon: '#5B8DF6' },
  teal:   { main: '#2AABB0', light: '#E8F9FA', icon: '#3EC9CF' },
};

// SVG Icons
const Icon = ({ name, size = 20, color = COLORS.textMid, style = {} }) => {
  const icons = {
    shield: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5.25 3.5 10.15 8 11.35C16.5 22.15 20 17.25 20 12V6l-8-4z" stroke={color} strokeWidth="1.8" strokeLinejoin="round" fill={color + '22'}/></svg>,
    user: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" stroke={color} strokeWidth="1.8"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" stroke={color} strokeWidth="1.8" strokeLinecap="round"/></svg>,
    calendar: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="16" rx="3" stroke={color} strokeWidth="1.8"/><path d="M8 3v4M16 3v4M3 10h18" stroke={color} strokeWidth="1.8" strokeLinecap="round"/></svg>,
    heart: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M12 21C12 21 3 14 3 8a4.5 4.5 0 018-2.8A4.5 4.5 0 0121 8c0 6-9 13-9 13z" stroke={color} strokeWidth="1.8" fill={color + '33'} strokeLinejoin="round"/></svg>,
    clock: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke={color} strokeWidth="1.8"/><path d="M12 7v5l3 3" stroke={color} strokeWidth="1.8" strokeLinecap="round"/></svg>,
    eye: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><ellipse cx="12" cy="12" rx="9" ry="6" stroke={color} strokeWidth="1.8"/><circle cx="12" cy="12" r="2.5" fill={color}/></svg>,
    bell: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M6 10a6 6 0 0112 0v4l2 2H4l2-2v-4z" stroke={color} strokeWidth="1.8" fill="none"/><path d="M10 20a2 2 0 004 0" stroke={color} strokeWidth="1.8" strokeLinecap="round"/></svg>,
    chevron: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    check: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" fill={color + '22'} stroke={color} strokeWidth="1.8"/><path d="M7.5 12l3 3 5-6" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    wind: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M5 8h10a3 3 0 100-6 3 3 0 00-3 3" stroke={color} strokeWidth="1.8" strokeLinecap="round"/><path d="M5 12h14a3 3 0 110 6 3 3 0 01-3-3" stroke={color} strokeWidth="1.8" strokeLinecap="round"/><path d="M5 16h8" stroke={color} strokeWidth="1.8" strokeLinecap="round"/></svg>,
    users: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.5" stroke={color} strokeWidth="1.8"/><path d="M3 19c0-3.3 2.7-6 6-6s6 2.7 6 6" stroke={color} strokeWidth="1.8" strokeLinecap="round"/><circle cx="18" cy="8" r="2.5" stroke={color} strokeWidth="1.8"/><path d="M21 19c0-2.5-1.5-4.5-3.5-5.4" stroke={color} strokeWidth="1.8" strokeLinecap="round"/></svg>,
    doc: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><rect x="5" y="3" width="14" height="18" rx="3" stroke={color} strokeWidth="1.8"/><path d="M9 8h6M9 12h6M9 16h4" stroke={color} strokeWidth="1.8" strokeLinecap="round"/></svg>,
    flask: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M9 3h6M10 3v7L6 19a1 1 0 00.9 1.4h10.2A1 1 0 0018 19l-4-9V3" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    home: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M3 11L12 3l9 8" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    grid: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke={color} strokeWidth="1.8"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke={color} strokeWidth="1.8"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke={color} strokeWidth="1.8"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke={color} strokeWidth="1.8"/></svg>,
    search: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke={color} strokeWidth="1.8"/><path d="M16.5 16.5L21 21" stroke={color} strokeWidth="1.8" strokeLinecap="round"/></svg>,
    chart: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M4 20h16M4 20V10l4-4 4 4 4-6v16" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    plus: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke={color} strokeWidth="2.5" strokeLinecap="round"/></svg>,
    activity: <svg width={size} height={size} viewBox="0 0 24 24" fill="none"><path d="M3 12h3l3-8 4 16 3-8h5" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>,
    meditation: null,
  };
  return <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', ...style }}>{icons[name]}</span>;
};

// Meditation figure SVG
const MeditationFigure = () => (
  <svg width="110" height="120" viewBox="0 0 110 120" fill="none">
    <ellipse cx="55" cy="95" rx="38" ry="12" fill="rgba(108,99,255,0.08)"/>
    <circle cx="55" cy="28" r="13" fill="rgba(108,99,255,0.18)" stroke="rgba(108,99,255,0.3)" strokeWidth="1.5"/>
    <ellipse cx="55" cy="68" rx="32" ry="22" fill="rgba(108,99,255,0.12)" stroke="rgba(108,99,255,0.2)" strokeWidth="1.2"/>
    <path d="M30 72 Q20 68 18 60 Q22 56 30 62" fill="rgba(108,99,255,0.2)" stroke="rgba(108,99,255,0.3)" strokeWidth="1.2"/>
    <path d="M80 72 Q90 68 92 60 Q88 56 80 62" fill="rgba(108,99,255,0.2)" stroke="rgba(108,99,255,0.3)" strokeWidth="1.2"/>
    <circle cx="55" cy="28" r="8" fill="rgba(108,99,255,0.3)"/>
    <ellipse cx="37" cy="78" rx="8" ry="5" fill="rgba(108,99,255,0.18)"/>
    <ellipse cx="73" cy="78" rx="8" ry="5" fill="rgba(108,99,255,0.18)"/>
  </svg>
);

// Breath Timer
const BreathTimer = ({ onClose }) => {
  const [phase, setPhase] = useState('inhale');
  const [count, setCount] = useState(4);
  const [progress, setProgress] = useState(0);
  const [done, setDone] = useState(false);

  useEffect(() => {
    const phases = [
      { name: 'inhale', duration: 4 },
      { name: 'hold', duration: 4 },
      { name: 'exhale', duration: 8 },
      { name: 'hold', duration: 4 },
    ];
    let phaseIdx = 0;
    let tick = 0;
    let elapsed = 0;
    let totalTime = 20;

    const interval = setInterval(() => {
      elapsed += 0.1;
      if (elapsed >= totalTime) {
        clearInterval(interval);
        setDone(true);
        return;
      }
      const cur = phases[phaseIdx];
      tick += 0.1;
      setProgress(elapsed / totalTime);
      setCount(Math.ceil(cur.duration - tick));
      if (tick >= cur.duration) {
        tick = 0;
        phaseIdx = (phaseIdx + 1) % phases.length;
        setPhase(phases[phaseIdx].name);
      }
    }, 100);
    return () => clearInterval(interval);
  }, []);

  const phaseLabels = { inhale: 'Breathe in…', hold: 'Hold…', exhale: 'Breathe out…' };

  return (
    <div style={{
      position: 'absolute', inset: 0, background: 'rgba(240,238,255,0.97)',
      display: 'flex', flexDirection: 'column', alignItems: 'center',
      justifyContent: 'center', zIndex: 100, borderRadius: 'inherit',
    }}>
      {done ? (
        <>
          <Icon name="check" size={48} color={COLORS.green} />
          <div style={{ marginTop: 16, fontSize: 18, fontWeight: 600, color: COLORS.text }}>Well done</div>
          <div style={{ marginTop: 8, fontSize: 13, color: COLORS.textSoft }}>You're ready for your next decision</div>
          <button onClick={onClose} style={{
            marginTop: 28, padding: '10px 32px', borderRadius: 24,
            background: COLORS.violet, color: 'white', border: 'none',
            fontSize: 14, fontWeight: 600, cursor: 'pointer',
          }}>Continue</button>
        </>
      ) : (
        <>
          <div style={{ position: 'relative', width: 120, height: 120 }}>
            <svg width="120" height="120" style={{ position: 'absolute' }}>
              <circle cx="60" cy="60" r="52" stroke="#e0deff" strokeWidth="6" fill="none"/>
              <circle cx="60" cy="60" r="52"
                stroke={COLORS.violet} strokeWidth="6" fill="none"
                strokeDasharray={(2 * Math.PI * 52).toString()}
                strokeDashoffset={(2 * Math.PI * 52 * (1 - progress)).toString()}
                strokeLinecap="round"
                style={{ transform: 'rotate(-90deg)', transformOrigin: '60px 60px', transition: 'stroke-dashoffset 0.1s linear' }}
              />
            </svg>
            <div style={{
              position: 'absolute', inset: 0, display: 'flex',
              flexDirection: 'column', alignItems: 'center', justifyContent: 'center',
            }}>
              <div style={{ fontSize: 28, fontWeight: 700, color: COLORS.violet }}>{Math.max(1, count)}</div>
            </div>
          </div>
          <div style={{ marginTop: 20, fontSize: 16, fontWeight: 500, color: COLORS.textMid }}>{phaseLabels[phase]}</div>
          <button onClick={onClose} style={{
            marginTop: 32, padding: '8px 24px', borderRadius: 24,
            background: 'transparent', color: COLORS.textSoft, border: '1px solid ' + COLORS.border,
            fontSize: 13, cursor: 'pointer',
          }}>Skip</button>
        </>
      )}
    </div>
  );
};

// Quick Action Sheet
const QuickSheet = ({ onClose }) => (
  <div style={{
    position: 'absolute', inset: 0, background: 'rgba(26,29,46,0.45)',
    display: 'flex', flexDirection: 'column', justifyContent: 'flex-end',
    zIndex: 200, borderRadius: 'inherit',
  }} onClick={onClose}>
    <div onClick={e => e.stopPropagation()} style={{
      background: 'white', borderRadius: '24px 24px 0 0',
      padding: '20px 20px 36px',
    }}>
      <div style={{ width: 36, height: 4, background: '#E0E3EE', borderRadius: 2, margin: '0 auto 20px' }} />
      <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.textSoft, marginBottom: 16, letterSpacing: '0.06em', textTransform: 'uppercase' }}>Quick Action</div>
      {[
        { icon: 'activity', label: 'Voice note', color: COLORS.blue },
        { icon: 'users', label: 'Quick referral', color: COLORS.violet },
        { icon: 'doc', label: 'Add note', color: COLORS.green },
      ].map(({ icon, label, color }) => (
        <div key={label} style={{
          display: 'flex', alignItems: 'center', gap: 14,
          padding: '14px 0', borderBottom: '1px solid ' + COLORS.border,
        }}>
          <div style={{
            width: 44, height: 44, borderRadius: 14,
            background: color + '18', display: 'flex', alignItems: 'center', justifyContent: 'center',
          }}>
            <Icon name={icon} size={20} color={color} />
          </div>
          <span style={{ fontSize: 15, fontWeight: 500, color: COLORS.text }}>{label}</span>
          <Icon name="chevron" size={18} color={COLORS.textSoft} style={{ marginLeft: 'auto' }} />
        </div>
      ))}
    </div>
  </div>
);

function SynapseApp() {
  const [breathOpen, setBreathOpen] = useState(false);
  const [quickOpen, setQuickOpen] = useState(false);
  const [activeNav, setActiveNav] = useState('home');
  const [expanded, setExpanded] = useState({});
  const [greeting, setGreeting] = useState('evening');
  const [statusMode, setStatusMode] = useState('stable');
  const [accentKey, setAccentKey] = useState('violet');
  const [tweaksVisible, setTweaksVisible] = useState(false);
  const scrollRef = useRef(null);

  const accent = accentMap[accentKey];
  const greetingText = { morning: 'Good morning', afternoon: 'Good afternoon', evening: 'Good evening' }[greeting];
  const statusText = statusMode === 'stable' ? 'Everything looks stable right now' : '2 updates need your attention';
  const statusColor = statusMode === 'stable' ? COLORS.green : COLORS.amber;

  // Tweaks wiring
  useEffect(() => {
    window.addEventListener('message', e => {
      if (e.data?.type === '__activate_edit_mode') setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');

    // DOM tweak controls
    const grEl = document.getElementById('tw-greeting');
    const stEl = document.getElementById('tw-status');
    const acEl = document.getElementById('tw-accent');
    if (grEl) grEl.addEventListener('change', e => { setGreeting(e.target.value); window.parent.postMessage({type:'__edit_mode_set_keys', edits:{greeting:e.target.value}},'*'); });
    if (stEl) stEl.addEventListener('change', e => { setStatusMode(e.target.value); window.parent.postMessage({type:'__edit_mode_set_keys', edits:{status:e.target.value}},'*'); });
    if (acEl) acEl.addEventListener('change', e => { setAccentKey(e.target.value); window.parent.postMessage({type:'__edit_mode_set_keys', edits:{accent:e.target.value}},'*'); });
  }, []);

  useEffect(() => {
    const panel = document.getElementById('tweaks-panel');
    if (panel) panel.style.display = tweaksVisible ? 'block' : 'none';
  }, [tweaksVisible]);

  const toggle = key => setExpanded(p => ({ ...p, [key]: !p[key] }));

  const continuityCards = [
    { icon: 'calendar', label: 'Follow-up tomorrow', sub: '3 patients', color: COLORS.green, bg: COLORS.greenLight },
    { icon: 'users', label: 'Pending specialist reply', sub: '2 cases', color: COLORS.amber, bg: COLORS.amberLight },
    { icon: 'doc', label: 'Plan to review BP trend', sub: '1 patient', color: COLORS.blue, bg: COLORS.blueLight },
    { icon: 'flask', label: 'Lab results', sub: '1 pending', color: accent.main, bg: accent.light },
  ];

  const recentItems = [
    { icon: 'activity', label: 'Reviewed ECG for patient R.S.', time: '2h ago', color: COLORS.blue },
    { icon: 'doc', label: 'Added note: hypertension follow-up', time: '4h ago', color: COLORS.green },
  ];

  const cardStyle = (extra = {}) => ({
    background: COLORS.card,
    borderRadius: 20,
    padding: 18,
    boxShadow: '0 2px 12px rgba(60,70,130,0.08)',
    marginBottom: 14,
    transition: 'transform 0.18s ease, box-shadow 0.18s ease',
    cursor: 'pointer',
    ...extra,
  });

  return (
    <div style={{ position: 'relative', width: '100%', height: '100%', overflow: 'hidden', fontFamily: 'Inter, sans-serif' }}>
      {breathOpen && <BreathTimer onClose={() => setBreathOpen(false)} />}
      {quickOpen && <QuickSheet onClose={() => setQuickOpen(false)} />}

      {/* Scrollable content */}
      <div ref={scrollRef} style={{
        height: '100%', overflowY: 'auto', overflowX: 'hidden',
        paddingBottom: 90,
        paddingTop: 0,
        scrollbarWidth: 'none',
      }}>

        {/* ── HERO SECTION ── */}
        <div style={{
          background: 'linear-gradient(160deg, #dde9f8 0%, #e8f4f0 55%, #edf2f8 100%)',
          padding: '110px 20px 36px 20px',
          position: 'relative',
          overflow: 'hidden',
        }}>
          {/* Decorative blobs */}
          <div style={{ position: 'absolute', top: -30, right: -40, width: 160, height: 160, borderRadius: '50%', background: 'rgba(180,210,255,0.35)', filter: 'blur(24px)' }} />
          <div style={{ position: 'absolute', bottom: -20, left: -20, width: 120, height: 120, borderRadius: '50%', background: 'rgba(160,230,200,0.3)', filter: 'blur(20px)' }} />
          {/* Subtle wave */}
          <svg style={{ position: 'absolute', bottom: 0, left: 0, width: '100%' }} viewBox="0 0 390 40" fill="none" preserveAspectRatio="none">
            <path d="M0 20 Q80 0 160 20 Q240 40 320 18 Q360 8 390 20 L390 40 L0 40Z" fill="#F4F6FA"/>
          </svg>

          {/* Top bar */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20, position: 'relative', zIndex: 1 }}>
            <div>
              <div style={{ fontSize: 14, color: COLORS.textMid, fontWeight: 400 }}>{greetingText},</div>
              <div style={{ fontSize: 26, fontWeight: 700, color: COLORS.text, letterSpacing: '-0.5px', lineHeight: 1.2 }}>Dr. Nair</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 6 }}>
                <Icon name="check" size={16} color={statusColor} />
                <span style={{ fontSize: 12, color: statusColor, fontWeight: 500 }}>{statusText}</span>
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <div style={{ position: 'relative' }}>
                <Icon name="bell" size={22} color={COLORS.textMid} />
                <div style={{
                  position: 'absolute', top: -2, right: -2, width: 8, height: 8,
                  borderRadius: '50%', background: accent.main, border: '1.5px solid white',
                }} />
              </div>
              <div style={{
                width: 38, height: 38, borderRadius: '50%',
                background: 'linear-gradient(135deg, #a8c4e8, #7ba8d8)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                border: '2px solid white',
              }}>
                <Icon name="user" size={18} color="white" />
              </div>
            </div>
          </div>
        </div>

        {/* ── CARDS AREA ── */}
        <div style={{ padding: '0 16px', marginTop: 2 }}>

          {/* System Status Card */}
          <div style={cardStyle()} onClick={() => toggle('status')}>
            <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                <div style={{
                  width: 40, height: 40, borderRadius: 12,
                  background: COLORS.greenLight,
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  <Icon name="shield" size={20} color={COLORS.green} />
                </div>
                <div>
                  <div style={{ fontSize: 15, fontWeight: 600, color: COLORS.text }}>System Status</div>
                  <div style={{ fontSize: 12, color: COLORS.green, fontWeight: 500 }}>All systems are stable</div>
                </div>
              </div>
              <div style={{
                display: 'flex', alignItems: 'center', gap: 6,
                background: COLORS.greenLight, padding: '5px 10px',
                borderRadius: 20,
              }}>
                <div style={{ width: 7, height: 7, borderRadius: '50%', background: COLORS.green }} />
                <span style={{ fontSize: 11, fontWeight: 600, color: COLORS.green }}>All Good</span>
              </div>
            </div>
            <div style={{ height: 1, background: COLORS.border, marginBottom: 14 }} />
            <div style={{ display: 'flex', gap: 10 }}>
              <div style={{
                flex: 1, background: COLORS.bg, borderRadius: 14, padding: '12px 14px',
                display: 'flex', alignItems: 'center', gap: 10,
              }}>
                <Icon name="users" size={18} color={COLORS.blue} />
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.text }}>1 referral</div>
                  <div style={{ fontSize: 11, color: COLORS.textSoft }}>awaiting response</div>
                </div>
              </div>
              <div style={{
                flex: 1, background: COLORS.bg, borderRadius: 14, padding: '12px 14px',
                display: 'flex', alignItems: 'center', gap: 10,
              }}>
                <Icon name="calendar" size={18} color={COLORS.blue} />
                <div>
                  <div style={{ fontSize: 13, fontWeight: 600, color: COLORS.text }}>1 follow-up</div>
                  <div style={{ fontSize: 11, color: COLORS.textSoft }}>due tomorrow</div>
                </div>
              </div>
              <div style={{ display: 'flex', alignItems: 'center' }}>
                <Icon name="chevron" size={18} color={COLORS.textSoft} />
              </div>
            </div>
          </div>

          {/* Priority Update Card */}
          <div style={cardStyle({ border: '1.5px solid ' + accent.light, background: 'white' })} onClick={() => toggle('priority')}>
            <div style={{ display: 'flex', alignItems: 'flex-start', gap: 12, marginBottom: 12 }}>
              <div style={{
                width: 44, height: 44, borderRadius: 14,
                background: accent.light,
                display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
              }}>
                <Icon name="heart" size={22} color={accent.main} />
              </div>
              <div style={{ flex: 1 }}>
                <div style={{ fontSize: 10, fontWeight: 700, color: accent.main, letterSpacing: '0.08em', textTransform: 'uppercase', marginBottom: 3 }}>Priority Update</div>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                  <div>
                    <div style={{ fontSize: 16, fontWeight: 700, color: COLORS.text, lineHeight: 1.2 }}>Referral Update</div>
                    <div style={{ fontSize: 12, color: COLORS.textMid, marginTop: 2 }}>Cardiology reviewing case</div>
                  </div>
                  <Icon name="chevron" size={18} color={COLORS.textSoft} />
                </div>
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 14 }}>
              <Icon name="clock" size={13} color={COLORS.amber} />
              <span style={{ fontSize: 12, color: COLORS.amber, fontWeight: 500 }}>Expected today</span>
            </div>
            <div style={{ display: 'flex', gap: 10 }}>
              <button style={{
                flex: 1, padding: '10px 0', borderRadius: 24,
                background: accent.main, color: 'white', border: 'none',
                fontSize: 13, fontWeight: 600, cursor: 'pointer',
                display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7,
                transition: 'opacity 0.15s',
              }}>
                <Icon name="eye" size={15} color="white" />
                Review
              </button>
              <button style={{
                flex: 1, padding: '10px 0', borderRadius: 24,
                background: 'transparent', color: COLORS.textMid,
                border: "1.5px solid " + (COLORS.border),
                fontSize: 13, fontWeight: 500, cursor: 'pointer',
                display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7,
              }}>
                <Icon name="clock" size={15} color={COLORS.textSoft} />
                Later
              </button>
            </div>
          </div>

          {/* Cognitive Reset Card */}
          <div style={cardStyle({
            background: 'linear-gradient(135deg, #f0eeff 0%, #e8f0ff 100%)',
            border: '1.5px solid rgba(108,99,255,0.12)',
            overflow: 'hidden', position: 'relative',
          })}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
              <div style={{ flex: 1 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 10 }}>
                  <Icon name="users" size={14} color={accent.main} />
                  <span style={{ fontSize: 10, fontWeight: 700, color: accent.main, letterSpacing: '0.08em', textTransform: 'uppercase' }}>Take a moment</span>
                </div>
                <div style={{ fontSize: 18, fontWeight: 700, color: COLORS.text, lineHeight: 1.3, marginBottom: 8, maxWidth: 170 }}>
                  You've handled multiple cases today
                </div>
                <div style={{ fontSize: 12, color: COLORS.textMid, lineHeight: 1.5, marginBottom: 16, maxWidth: 170 }}>
                  Take 20 seconds before your next decision
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
                  <button onClick={() => setBreathOpen(true)} style={{
                    padding: '9px 16px', borderRadius: 24,
                    background: accent.main, color: 'white', border: 'none',
                    fontSize: 12, fontWeight: 600, cursor: 'pointer',
                    display: 'flex', alignItems: 'center', gap: 6,
                  }}>
                    <Icon name="wind" size={14} color="white" />
                    Breathe (20s)
                  </button>
                  <button style={{
                    background: 'none', border: 'none', fontSize: 12,
                    color: COLORS.textMid, cursor: 'pointer', fontWeight: 500,
                  }}>Skip</button>
                </div>
              </div>
              <div style={{ marginTop: -8, marginRight: -4 }}>
                <MeditationFigure />
              </div>
            </div>
          </div>

          {/* Continuity Strip */}
          <div style={{ marginBottom: 14 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 12 }}>
              <div style={{ fontSize: 15, fontWeight: 600, color: COLORS.text }}>Continuity at a glance</div>
              <span style={{ fontSize: 12, color: accent.main, fontWeight: 500 }}>View all</span>
            </div>
            <div style={{
              display: 'flex', gap: 10, overflowX: 'auto', paddingBottom: 8,
              scrollbarWidth: 'none', WebkitOverflowScrolling: 'touch',
            }}>
              {continuityCards.map(({ icon, label, sub, color, bg }) => (
                <div key={label} style={{
                  background: COLORS.card, borderRadius: 16, padding: '14px 14px',
                  minWidth: 118, maxWidth: 118, flexShrink: 0,
                  boxShadow: '0 2px 8px rgba(60,70,130,0.07)',
                  cursor: 'pointer',
                }}>
                  <div style={{
                    width: 32, height: 32, borderRadius: 10, background: bg,
                    display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 10,
                  }}>
                    <Icon name={icon} size={16} color={color} />
                  </div>
                  <div style={{ fontSize: 12, fontWeight: 600, color: COLORS.text, lineHeight: 1.3, marginBottom: 4 }}>{label}</div>
                  <div style={{ fontSize: 11, fontWeight: 600, color: color }}>{sub}</div>
                </div>
              ))}
            </div>
            {/* Dots */}
            <div style={{ display: 'flex', justifyContent: 'center', gap: 6, marginTop: 8 }}>
              {[0,1,2,3].map(i => (
                <div key={i} style={{
                  width: i === 0 ? 18 : 6, height: 6,
                  borderRadius: 3,
                  background: i === 0 ? accent.main : '#D8DCE8',
                  transition: 'width 0.2s',
                }} />
              ))}
            </div>
          </div>

          {/* Recent Activity */}
          <div style={{ marginBottom: 14 }}>
            <div style={{ fontSize: 15, fontWeight: 600, color: COLORS.text, marginBottom: 12 }}>Recent activity</div>
            {recentItems.map(({ icon, label, time, color }) => (
              <div key={label} style={{
                ...cardStyle({ marginBottom: 10, padding: '14px 16px' }),
                display: 'flex', alignItems: 'center', gap: 12,
              }}>
                <div style={{
                  width: 36, height: 36, borderRadius: 11,
                  background: color + '18',
                  display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0,
                }}>
                  <Icon name={icon} size={17} color={color} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontSize: 13, fontWeight: 500, color: COLORS.text, lineHeight: 1.3 }}>{label}</div>
                  <div style={{ fontSize: 11, color: COLORS.textSoft, marginTop: 2 }}>{time}</div>
                </div>
                <Icon name="chevron" size={16} color={COLORS.textSoft} />
              </div>
            ))}
          </div>

        </div>
      </div>

      {/* ── BOTTOM NAV ── */}
      <div style={{
        position: 'absolute', bottom: 0, left: 0, right: 0,
        background: 'rgba(255,255,255,0.96)',
        backdropFilter: 'blur(12px)',
        borderTop: '1px solid ' + COLORS.border,
        padding: '10px 0 20px',
        display: 'flex', alignItems: 'center', justifyContent: 'space-around',
      }}>
        {[
          { id: 'home', icon: 'home', label: 'Home' },
          { id: 'patients', icon: 'users', label: 'Patients' },
          { id: null, icon: null, label: null }, // floating btn placeholder
          { id: 'notes', icon: 'doc', label: 'Notes' },
          { id: 'reports', icon: 'chart', label: 'Reports' },
        ].map((item, idx) => {
          if (!item.id) return (
            <div key="fab" style={{ width: 56 }} />
          );
          const active = activeNav === item.id;
          return (
            <button key={item.id} onClick={() => setActiveNav(item.id)} style={{
              display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 3,
              background: 'none', border: 'none', cursor: 'pointer',
              padding: '0 8px',
            }}>
              <Icon name={item.icon} size={22} color={active ? accent.main : COLORS.textSoft} />
              <span style={{ fontSize: 10, fontWeight: active ? 600 : 400, color: active ? accent.main : COLORS.textSoft }}>{item.label}</span>
            </button>
          );
        })}

        {/* FAB */}
        <div style={{
          position: 'absolute', top: -24, left: '50%', transform: 'translateX(-50%)',
        }}>
          <button onClick={() => setQuickOpen(true)} style={{
            width: 52, height: 52, borderRadius: '50%',
            background: 'linear-gradient(135deg, ' + COLORS.blue + ', ' + accent.main + ')',
            border: 'none', cursor: 'pointer',
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            boxShadow: '0 4px 18px ' + accent.main + '55',
            transition: 'transform 0.15s',
          }}>
            <Icon name="plus" size={24} color="white" />
          </button>
        </div>
      </div>
    </div>
  );
}

// Mount inside iOS frame
const frameRoot = document.getElementById('root');
ReactDOM.createRoot(frameRoot).render(
  <IOSDevice>
    <SynapseApp />
  </IOSDevice>
);
</script>
